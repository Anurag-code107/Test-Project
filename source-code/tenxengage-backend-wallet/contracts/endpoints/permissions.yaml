openapi: 3.0.3
info:
  title: Permission Endpoints
  description: Permission catalog and effective permission resolution
  version: 1.0.0

paths:
  /api/v1/permissions:
    get:
      summary: List all permissions in catalog
      tags: [Permissions]
      security:
        - bearerAuth: []
      x-permission: action.permissions.view
      responses:
        "200":
          description: Full permission catalog (124 permissions)

  /api/v1/permissions/effective:
    get:
      summary: Get current user's effective permissions
      tags: [Permissions]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Set of effective permission keys for the authenticated user

  /api/v1/permissions/effective/{userId}:
    get:
      summary: Get specific user's effective permissions
      tags: [Permissions]
      security:
        - bearerAuth: []
      x-permission: action.permissions.view
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Set of effective permission keys for the specified user

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
