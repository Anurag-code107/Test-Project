openapi: 3.0.3
info:
  title: Audit Log Endpoints
  description: Immutable audit trail queries
  version: 1.0.0

paths:
  /api/v1/audit-logs:
    get:
      summary: Get audit logs (paginated)
      tags: [Audit Logs]
      security:
        - bearerAuth: []
      x-permission: action.activity_log.view
      parameters:
        - name: userType
          in: query
          schema: { type: string }
          description: Filter by actor role type
        - name: action
          in: query
          schema:
            type: string
            enum:
              [
                CREATED,
                EDITED,
                DELETED,
                ACTIVATED,
                DEACTIVATED,
                SUBMITTED,
                APPROVED,
                REJECTED,
                EXPIRED,
                CLAIMED,
                UNCLAIMED,
                UPLOADED,
                SYNCED,
                LOGGED_IN,
                LOGGED_OUT,
                ANONYMIZED,
                DATA_EXPORTED,
              ]
        - name: search
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated audit log entries

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
