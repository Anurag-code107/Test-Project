openapi: 3.0.3
info:
  title: Reward Balance Endpoints
  description: Reward balance queries
  version: 1.0.0

paths:
  /api/v1/reward-balances:
    get:
      summary: Get my reward balances
      tags: [Reward Balances]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of balances per currency for the authenticated user

  /api/v1/reward-balances/{userId}:
    get:
      summary: Get reward balances for a user (admin)
      tags: [Reward Balances]
      security:
        - bearerAuth: []
      x-permission: action.reward_balances.admin
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: List of balances per currency for the specified user

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
