spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tenxengage}
    username: tenxengage
    password: localdev
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      fail-fast: false
    listener:
      missing-topics-fatal: false
  mail:
    password: ${RESEND_API_KEY:}

app:
  mail:
    enabled: true
    from: ${MAIL_FROM:onboarding@resend.dev}

redemption:
  distribution:
    # XTRM has no company-to-user transfer API: TransferFund always sources from the ISSUER's own wallet, so a
    # partner company's wallet cannot fund a payout. Until XTRM ships that, the two XTRM-backed rails
    # (GIFT_CARD, BANK_TRANSFER) are switched OFF. WALLET_CREDIT is unaffected — it calls no vendor.
    #
    # Deliberately not stubbed: a fake success would DEBIT the ledger and mark the item COMPLETED for money
    # that never moved, notify recipients of a reward that never arrives, and leave no way to tell real
    # payouts from fabricated ones once XTRM is live.
    #
    # Flip to true (XTRM_PAYOUT_RAILS_ENABLED=true) when XTRM supports it — no code change needed.
    # Company→seller payouts work: a seller created under their own company's credentials is Connected to
    # that company, verified against the sandbox 2026-08-26. The wallet rail that used to carry distribution
    # while this was off has been retired, so leaving it false now disables distribution entirely.
    xtrm-payout-rails-enabled: ${XTRM_PAYOUT_RAILS_ENABLED:true}
  webhook:
    xtrm:
      signing-secret: dev-xtrm-secret-local
    xoxoday:
      signing-secret: dev-xoxoday-secret-local
  return-webhook:
    xoxoday:
      signing-secret: dev-return-xoxoday-secret-local
  xoxoday:
    return-api-url: https://api.xoxoday.com/api/v1/plum/returns
  xtrm:
    base-url: https://xapisandbox.xtrm.com
    token-url: https://xapisandbox.xtrm.com/oAuth/token
    # Set real values via environment variables or .env.local (never commit credentials)
    client-id: ${XTRM_CLIENT_ID:placeholder-client-id}
    client-secret: ${XTRM_CLIENT_SECRET:placeholder-client-secret}
    issuer-account-number: ${XTRM_ISSUER_ACCOUNT:SPN26237883}
    # Cash payout rails: AnyPay Individual (XTR94502) is the default; Bank/ACH (XTR94500) when the user picks BANK.
    payment-method-id: ${XTRM_PAYMENT_METHOD:XTR94502}
    bank-payment-method-id: ${XTRM_BANK_PAYMENT_METHOD:XTR94500}
    # Rapid Transfer (card) rail — used for CARD payout method + card withdrawals.
    rapid-transfer-payment-method-id: ${XTRM_RAPID_TRANSFER_PAYMENT_METHOD:XTR94508}
    wallet-id: ${XTRM_WALLET_ID:203871}
    # XTRM emails the company admin on CreateBeneficiary. That email is the ONLY way the admin gets into
    # XTRM's own portal, so it is on here too — `local` runs the REAL client against the sandbox, which is
    # exactly where portal access is needed for testing. Set the env var to false to suppress it.
    beneficiary-email-notification: ${XTRM_BENEFICIARY_EMAIL_NOTIFICATION:true}
    program-id: ${XTRM_PROGRAM_ID:2314}
    # Empty = accept any KYC tier. Set once XTRM confirms which level clears payouts. Shipping empty is
    # deliberate: we have seen exactly one value (Basic) and a rule from one observation is a guess.
    acceptable-identity-levels: ${XTRM_ACCEPTABLE_IDENTITY_LEVELS:}
    # Where a company admin completes identity verification. Served from here rather than hardcoded in the
    # frontend so it can never disagree with base-url about WHICH XTRM this deployment talks to — pointing a
    # sandbox admin at the production portal would have them verify an account we never created.
    # Cannot be embedded: every xtrm.com host sends X-Frame-Options: SAMEORIGIN (verified 2026-09-01), so a
    # browser refuses to frame it. Opened in a new tab.
    portal-url: ${XTRM_PORTAL_URL:https://sandbox.xtrm.com/login/}
  # Scheduled batch payout sweep (BatchRedemptionProcessor). Collects matured RESERVED batch items per client
  # and sends them via XTRM BatchTransfer, split into chunks so one request never exceeds XTRM's per-request limit.
  batch:
    # Spring cron for the sweep. Daily at 2 AM. (Local demo used every 2 minutes: "0 */2 * * * *")
    cron: ${REDEMPTION_BATCH_CRON:0 0 2 * * *}
    # Max line items per BatchTransfer request — a client's eligible set is chunked into batches of this size.
    # XTRM allows up to 20 items per BatchTransfer.
    max-items-per-batch: ${REDEMPTION_BATCH_MAX_ITEMS:20}
  # Missed-webhook recovery cron (RedemptionReconciliationService): polls XTRM for in-flight payout status
  # and settles via the shared settlement path. 3-day cap; past that → manual review, never auto-released.
  reconciliation:
    # Spring cron. Every 30 minutes. (Local demo used every minute: "0 */1 * * * *")
    cron: ${REDEMPTION_RECONCILIATION_CRON:0 */30 * * * *}
    cap-days: ${REDEMPTION_RECONCILIATION_CAP_DAYS:3}
    success-statuses: Success,Completed,Released
    failed-statuses: Failed
    batch-page-size: 50
  # Balance-expiration warn+expire sweep (BalanceExpiryBatchService): warns partners before expiry,
  # then debits expired reward balances. Daily at 2 AM. (Local demo used every 2 minutes: "0 */2 * * * *")
  balance-expiry:
    cron: ${REDEMPTION_BALANCE_EXPIRY_CRON:0 0 2 * * *}

logging:
  level:
    # Keep our own logs verbose (redemption / XTRM / reconciliation [step=...] lines).
    com.tenxengage: DEBUG
    # Quiet the noise that made the console race by. Raise any of these back to DEBUG/TRACE when debugging
    # SQL or security specifically.
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.apache.kafka: ERROR
