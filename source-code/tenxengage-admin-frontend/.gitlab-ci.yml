stages:
  - build-npm
  - sast-sonarqube

variables:
  BUILD_FOLDER: "dist"

cache:
  - key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull  # prevent subsequent jobs from modifying cache

build:
  stage: build-npm
  image: node:22.12.0-alpine3.21
  # tags:
  #   - tenxengage_frontend
  script:
    - npm install -f
    - npm run build
  artifacts:
    paths:
      - ${BUILD_FOLDER}/
  only:
    - dev

sonarqube:
  stage: sast-sonarqube
  # tags:
  #   - tenxengage_frontend
  image: sonarsource/sonar-scanner-cli:12
  only:
    - dev
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
    PROJECT_KEY: ${CI_PROJECT_NAME}
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.projectKey=${PROJECT_KEY} -Dsonar.projectName="New Tenxengage Admin Frontend Dev" -Dsonar.sources=. -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.token=${SONAR_TOKEN} -Dsonar.scanner.skipJreProvisioning=true
  allow_failure: true
