spring:
  application:
    name: tenxengage-backend
  profiles:
    active: local
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        size-parameter: pageSize
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: tenxengage-approval
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
  auth:
    strategy: jwt
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production-this-needs-to-be-at-least-256-bits}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  cookie:
    secure: ${COOKIE_SECURE:false}
  approval:
    token-secret: ${APPROVAL_TOKEN_SECRET:default-approval-secret-change-in-production-must-be-256-bits-long}
    token-expiration-ms: 172800000
    base-url: ${APP_BASE_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@rewardscloud.com}
    enabled: ${MAIL_ENABLED:false}
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-sonnet-4-6
    max-tokens: 8192
  connector:
    encryption-key: ${CONNECTOR_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef}
    enabled: ${AI_ENABLED:true}
  seed:
    enabled: ${SEED_ENABLED:false}
  return-webhook:
    xoxoday:
      signing-secret: ${RETURN_WEBHOOK_XOXODAY_SIGNING_SECRET:}
  xoxoday:
    return-api-url: ${XOXODAY_RETURN_API_URL:https://api.xoxoday.com/api/v1/plum/returns}
  storage:
    provider: ${STORAGE_PROVIDER:s3}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    bucket: ${STORAGE_BUCKET:incentive-documents}
    gcp:
      project-id: ${GCP_PROJECT_ID:}
    local:
      base-dir: ${STORAGE_LOCAL_BASE_DIR:./storage-data}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    mail:
      enabled: false
