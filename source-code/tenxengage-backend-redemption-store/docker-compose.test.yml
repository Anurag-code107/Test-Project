name: tenxengage-test

# Spun up by /execute-integration-tests for the FE T1 Playwright real-backend pass.
# Uses isolated ports (5433, 6380, 9093) so the dev stack (5432, 6379, 9092) can
# remain up or down without conflict.
#
# After all T1 tests: docker compose -f docker-compose.test.yml down -v

services:
  postgres-test:
    image: postgres:16
    container_name: tenxengage-postgres-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: tenxengage
      POSTGRES_USER: tenxengage
      POSTGRES_PASSWORD: localdev
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenxengage"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  redis-test:
    image: redis:7-alpine
    container_name: tenxengage-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka-test:
    image: apache/kafka:3.7.0
    container_name: tenxengage-kafka-test
    ports:
      - "9093:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: TkU4OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 && echo ok || /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
