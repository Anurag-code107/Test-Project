spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tenxengage}
    username: tenxengage
    password: localdev
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      fail-fast: false
    listener:
      missing-topics-fatal: false
  mail:
    password: ${RESEND_API_KEY:}

app:
  mail:
    enabled: true
    from: ${MAIL_FROM:onboarding@resend.dev}

redemption:
  webhook:
    xtrm:
      signing-secret: dev-xtrm-secret-local
    xoxoday:
      signing-secret: dev-xoxoday-secret-local
  return-webhook:
    xoxoday:
      signing-secret: dev-return-xoxoday-secret-local
  xoxoday:
    return-api-url: https://api.xoxoday.com/api/v1/plum/returns
  xtrm:
    base-url: https://xapisandbox.xtrm.com
    token-url: https://xapisandbox.xtrm.com/oAuth/token
    # Set real values via environment variables or .env.local (never commit credentials)
    client-id: ${XTRM_CLIENT_ID:placeholder-client-id}
    client-secret: ${XTRM_CLIENT_SECRET:placeholder-client-secret}
    issuer-account-number: ${XTRM_ISSUER_ACCOUNT:SPN26237883}
    payment-method-id: ${XTRM_PAYMENT_METHOD:XTR94505}
    wallet-id: ${XTRM_WALLET_ID:203871}
    program-id: ${XTRM_PROGRAM_ID:2314}

logging:
  level:
    com.tenxengage: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.apache.kafka: ERROR
