openapi: 3.0.3
info:
  title: Reward Balance Endpoints
  description: "DEPRECATED — delegates to WalletService. Kept alive during frontend migration to /api/v1/wallets. See endpoints/wallet.yaml for the canonical wallet endpoints."
  version: 1.0.0

paths:
  /api/v1/reward-balances:
    get:
      summary: Get my reward balances (deprecated)
      description: "DEPRECATED. Delegates to WalletService.getMyWallets(). Returns RewardWalletResponse shape with `balance` kept as alias for `availableBalance` for backwards compatibility. Migrate to GET /api/v1/wallets/me."
      deprecated: true
      x-modified: true
      tags: [Reward Balances]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of wallets per currency for the authenticated user (RewardWalletResponse shape; `balance` field present as alias for `availableBalance`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RewardWalletResponse'
        "401":
          description: Not authenticated

  /api/v1/reward-balances/{userId}:
    get:
      summary: Get reward balances for a user (admin) (deprecated)
      description: "DEPRECATED. Delegates to WalletService.getUserWallets(userId). Migrate to GET /api/v1/wallets/users/{userId}."
      deprecated: true
      x-modified: true
      tags: [Reward Balances]
      security:
        - bearerAuth: []
      x-permission: action.redemption.view_all_history
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: List of wallets per currency for the specified user (RewardWalletResponse shape)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RewardWalletResponse'
        "401":
          description: Not authenticated
        "403":
          description: Caller is not CLIENT_ADMIN
        "404":
          description: User not found in tenant

components:
  schemas:
    RewardWalletResponse:
      type: object
      required: [id, walletType, currencyId, availableBalance, reservedBalance, balance]
      properties:
        id:
          type: string
          format: uuid
        walletType:
          type: string
          enum: [INDIVIDUAL, COMPANY]
        currencyId:
          type: string
        availableBalance:
          type: string
          description: Spendable balance as decimal string
        reservedBalance:
          type: string
          description: Locked in-flight balance as decimal string
        balance:
          type: string
          description: "Alias for availableBalance — kept for backwards compatibility during transition"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
