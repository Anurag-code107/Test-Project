openapi: 3.0.3
info:
  title: Deal Qualifier Endpoints
  description: Real-time deal qualification, invoice processing, and AI insights
  version: 1.0.0

paths:
  /api/v1/deal-qualifier/evaluate:
    post:
      summary: Evaluate deal eligibility
      tags: [Deal Qualifier]
      security:
        - bearerAuth: []
      x-permission: action.deal_qualifier.evaluate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dealValue, productSkus, customerSegment, closeDate]
              properties:
                dealValue: { type: number }
                productSkus:
                  type: array
                  items: { type: string }
                customerSegment:
                  type: string
                  description: Customer Segment value (e.g. "Enterprise", "SMB"). Must match one of the sample values defined on the Sales Data Object's Customer Segment field for the tenant.
                closeDate: { type: string, format: date-time }
      responses:
        "200":
          description: Qualification results with eligible incentives

  /api/v1/deal-qualifier/upload-invoice:
    post:
      summary: Upload invoice for extraction
      description: Upload an invoice file and extract deal details using AI
      tags: [Deal Qualifier]
      security:
        - bearerAuth: []
      x-permission: action.deal_qualifier.upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Extracted invoice data

  /api/v1/deal-qualifier/{incentiveId}/insights:
    post:
      summary: Stream deal insights (SSE)
      description: AI-generated insights about deal qualification for a specific incentive
      tags: [Deal Qualifier]
      security:
        - bearerAuth: []
      x-permission: action.deal_qualifier.insights
      parameters:
        - name: incentiveId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Deal context for insight generation
      responses:
        "200":
          description: SSE stream of AI insights
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/deal-qualifier/partner-context:
    get:
      summary: Get partner context for deal qualifier
      description: |
        Returns the partner's region (from location assignments), the partner
        company's "Partner Type" metadata value, and the available Customer
        Segment options sourced from the tenant's Sales Data Object's
        "Customer Segment" field sampleValues.
      tags: [Deal Qualifier]
      security:
        - bearerAuth: []
      x-permission: action.deal_qualifier.context
      responses:
        "200":
          description: Partner context
          content:
            application/json:
              schema:
                type: object
                properties:
                  region: { type: string, nullable: true }
                  partnerType: { type: string, nullable: true }
                  customerSegmentOptions:
                    type: array
                    description: Sample values for the Sales Data Object's Customer Segment field, used to populate the Deal Qualifier's segment dropdown. Empty if the tenant has not configured the field.
                    items: { type: string }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
