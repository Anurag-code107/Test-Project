openapi: 3.0.3
info:
  title: Partner User Endpoints
  description: Partner admin management of users within their company
  version: 1.0.0

paths:
  /api/v1/partner-users:
    get:
      summary: List users in partner admin's company
      tags: [Partner Users]
      security:
        - bearerAuth: []
      x-permission: action.users.view
      responses:
        "200":
          description: List of users in the partner company

  /api/v1/partner-users/{userId}/permissions:
    get:
      summary: Get effective permissions for a user
      tags: [Partner Users]
      security:
        - bearerAuth: []
      x-permission: action.permissions.view
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Set of effective permission keys

    put:
      summary: Update permission overrides for a seller
      tags: [Partner Users]
      security:
        - bearerAuth: []
      x-permission: action.permissions.assign
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions:
                  type: object
                  additionalProperties:
                    type: boolean
      responses:
        "200":
          description: Permission overrides updated

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
